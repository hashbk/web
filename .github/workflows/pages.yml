name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/public/**'
      - 'web/scripts/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/tsconfig.json'
      - 'web/vite.config*.ts'
      - 'flutter-web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build JS bridge bundle
        run: |
          npm ci
          npm run gen-proto
          npm run gen-lang
          npm run build
        working-directory: web

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Copy Flutter web template
        run: |
          mkdir -p rustdesk/flutter/web
          cp -r flutter-web/* rustdesk/flutter/web/

      - name: Inject JS bridge bundle
        run: |
          mkdir -p rustdesk/flutter/web/js
          cp web/dist/rustdesk-web.js rustdesk/flutter/web/js/rustdesk-web.js
          cp -r web/dist/chunks rustdesk/flutter/web/js/chunks 2>/dev/null || true
          cp -r web/dist/assets rustdesk/flutter/web/js/assets 2>/dev/null || true
          cp web/dist/ffmpeg.js rustdesk/flutter/web/ffmpeg.js
          cp web/dist/ffmpeg-core.js rustdesk/flutter/web/ffmpeg-core.js
          cp web/dist/ffmpeg-core.wasm rustdesk/flutter/web/ffmpeg-core.wasm

      - name: Flutter pub get
        run: flutter pub get
        working-directory: rustdesk/flutter

      - name: Build Flutter web
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          flutter build web --release --base-href "/${REPO_NAME}/" --obfuscate --split-debug-info=build/symbols
        working-directory: rustdesk/flutter

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: rustdesk/flutter/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
